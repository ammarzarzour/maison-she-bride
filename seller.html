<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison She Bride | بوابة التاجر</title><style>body{font-family:system-ui,Tahoma;background:#f5f7f4;color:#173a2d;margin:0}main{max-width:460px;margin:6vh auto;background:white;padding:25px;border-radius:16px;box-shadow:0 4px 22px #0001}h1{font-size:24px}input,button{display:block;width:100%;box-sizing:border-box;padding:13px;margin:12px 0;border-radius:9px;border:1px solid #cad5cf;font:inherit}button{background:#145b46;color:white;border:0}p{line-height:1.7}#msg{white-space:pre-wrap}a{color:#145b46}</style><main><h1>Maison She Bride</h1><h2>بوابة التجار</h2><p>سجّل حسابك ثم قدّم طلب اعتماد متجرك. لن تُنشر منتجاتك قبل موافقة الإدارة.</p><div id="auth"><input id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور (6 أحرف على الأقل)"><button id="signup">إنشاء حساب</button><button id="login">تسجيل الدخول</button></div><div id="seller" hidden><p id="welcome"></p><input id="store" maxlength="100" placeholder="اسم متجرك"><button id="apply">إرسال طلب اعتماد متجر</button><button id="logout">تسجيل الخروج</button></div><p id="msg" role="status"></p><a href="./">العودة إلى المتجر</a></main><script>
const base='https://cymwmswpseevemxtugdb.supabase.co',key='sb_publishable_OevT9B8LeDvgIzOWtktYTA__LpPRQBE';
const el=id=>document.getElementById(id);let access='',uid='';
function message(s){el('msg').textContent=s}
async function call(path,method,body,token){let r=await fetch(base+path,{method,headers:{apikey:key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.msg||data.error_description||data.message||'تعذر تنفيذ الطلب');return data}
function showUser(user,token){uid=user.id;access=token;el('auth').hidden=true;el('seller').hidden=false;el('welcome').textContent='مرحباً '+(user.email||'');}
async function authenticate(kind){message('جارٍ المعالجة...');try{let email=el('email').value.trim(),password=el('password').value;if(!email||password.length<6)throw new Error('أدخل بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل');let data=await call('/auth/v1/'+(kind==='signup'?'signup':'token?grant_type=password'),'POST',{email,password});if(data.access_token&&data.user){showUser(data.user,data.access_token);message('تم تسجيل الدخول. يمكنك طلب اعتماد متجرك.')}else message('تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيده، ثم سجّل الدخول.')}catch(e){message(e.message)}}
el('signup').onclick=()=>authenticate('signup');el('login').onclick=()=>authenticate('login');
el('apply').onclick=async()=>{message('جارٍ إرسال الطلب...');try{const name=el('store').value.trim();if(name.length<2)throw new Error('أدخل اسم متجر من حرفين على الأقل');await call('/rest/v1/stores','POST',{name,owner_id:uid,status:'pending'},access);message('تم إرسال طلب المتجر، وهو بانتظار موافقة الإدارة.')}catch(e){message(e.message)}};
el('logout').onclick=()=>{access='';uid='';el('auth').hidden=false;el('seller').hidden=true;el('password').value='';message('تم تسجيل الخروج من هذه الصفحة.')};
</script></html>
