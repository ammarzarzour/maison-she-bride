<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سند سوريا | Sanad Syria — Preview</title><style>:root{font-family:system-ui,Arial;background:#f3f5f4;color:#27342f}*{box-sizing:border-box}body{margin:0}header{background:#176c4c;color:white;padding:20px}header .bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:26px}small{opacity:.85}button,select{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid #b6c8bd;background:white;color:#164e38;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c7a44c}main{max-width:1100px;margin:28px auto;padding:0 16px}.notice{background:#fff8e4;border:1px solid #d7b966;padding:14px;border-radius:10px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #dbe2dd;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0000000a}.card h2{font-size:18px;margin:0 0 12px}.card p{line-height:1.6;color:#65736b}.card button{background:#176c4c;color:white}.tag{color:#96702b;font-weight:bold}section{margin:25px 0}footer{padding:30px;text-align:center;color:#67756d}#status{font-weight:bold}a{color:#176c4c}</style></head><body><header><div class="bar"><div><h1 id="brand">سند سوريا</h1><small id="subtitle"></small></div><label><span id="langLabel">اللغة</span> <select id="language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select></label></div></header><main><div class="notice" id="notice" role="status"></div><section><h2 id="heading"></h2><p id="intro"></p><div class="grid" id="services"></div></section><section class="card"><h2 id="requestHeading"></h2><p id="requestIntro"></p><div id="status" aria-live="polite"></div></section><section class="card"><h2 id="stepsHeading"></h2><ol id="steps"></ol></section><section class="card"><h2 id="securityHeading"></h2><p id="securityText"></p></section></main><footer id="footer"></footer><script>'use strict';const tr={ar:{subtitle:'بوابة خدمات رقمية — نسخة عرض أولية',lang:'اللغة',notice:'نسخة تجريبية غير رسمية. لا يوجد تسجيل دخول أو إرسال طلبات حقيقية أو اتصال بجهات حكومية.',heading:'الخدمات',intro:'استعرض وحدات المنصة المقترحة. الأزرار تعرض حالة الميزة فقط.',request:'متابعة الطلبات',requestIntro:'ستظهر هنا الطلبات وحالاتها بعد ربط قاعدة البيانات ونظام الصلاحيات.',stepsHeading:'مراحل معالجة الطلب',steps:['إنشاء حساب والتحقق من الهوية (قيد التطوير)','تعبئة الطلب وإرفاق المستندات (قيد التطوير)','مراجعة الطلب من الإدارة (قيد التطوير)','متابعة الحالة وإشعارات الإنجاز (قيد التطوير)'],security:'حماية البيانات',securityText:'لا تُدخل بياناتك الشخصية أو صور الوثائق في هذه النسخة. لم يُفعّل رفع المستندات أو التحقق من الهوية بعد.',footer:'سند سوريا — نموذج أولي مستقل عن الجهات الحكومية',button:'استعراض',unavailable:'هذه الخدمة قيد التطوير ولا تستقبل طلبات حالياً.',services:[['الهوية والحساب','إدارة الحسابات والتحقق من الهوية'],['الوكالات والتفويض','طلبات التفويض والوكالات'],['المستندات','رفع المستندات والتحقق منها'],['المواعيد','حجز المواعيد ومتابعتها'],['المدفوعات','الدفع مؤجّل وغير مفعّل'],['لوحة الإدارة','مراجعة الطلبات وإدارة الصلاحيات']]},en:{subtitle:'Digital services portal — early preview',lang:'Language',notice:'Unofficial demo. No real sign-in, submissions, or government integrations are available.',heading:'Services',intro:'Explore planned modules. Buttons only show development status.',request:'Request tracking',requestIntro:'Requests and statuses will appear here after database and access control integration.',stepsHeading:'Request workflow',steps:['Create account and verify identity (planned)','Complete request and attach documents (planned)','Administrative review (planned)','Track status and notifications (planned)'],security:'Data protection',securityText:'Do not enter personal data or document photos in this preview. Document uploads and identity verification are not enabled.',footer:'Sanad Syria — independent prototype, not a government service',button:'Explore',unavailable:'This service is under development and does not accept submissions yet.',services:[['Identity & accounts','Account management and identity verification'],['Authorizations','Authorization and agency requests'],['Documents','Document upload and verification'],['Appointments','Book and track appointments'],['Payments','Deferred and disabled'],['Admin console','Review requests and manage access']]}};const $=id=>document.getElementById(id);let pref=localStorage.getItem('sanad_lang')||'auto';function language(){return pref==='auto'?(navigator.language.toLowerCase().startsWith('ar')?'ar':'en'):pref}function render(){const l=language(),t=tr[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('language').value=pref;for(const [id,key] of Object.entries({subtitle:'subtitle',langLabel:'lang',notice:'notice',heading:'heading',intro:'intro',requestHeading:'request',requestIntro:'requestIntro',stepsHeading:'stepsHeading',securityHeading:'security',securityText:'securityText',footer:'footer'}))$(id).textContent=t[key];$('brand').textContent=l==='ar'?'سند سوريا':'Sanad Syria';$('steps').replaceChildren(...t.steps.map(step=>{const li=document.createElement('li');li.textContent=step;return li}));$('services').replaceChildren(...t.services.map(([title,desc])=>{const article=document.createElement('article');article.className='card';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=desc;const b=document.createElement('button');b.type='button';b.textContent=t.button;b.addEventListener('click',()=>{$('status').textContent=t.unavailable;$('requestHeading').scrollIntoView({behavior:'smooth'})});article.append(h,p,b);return article}));$('status').textContent=''}$('language').addEventListener('change',e=>{pref=e.target.value;localStorage.setItem('sanad_lang',pref);render()});render();</script></body></html>
