name: Sanad Syria standalone preview artifact

on:
  push:
    branches: [main]
    paths:
      - 'sanad/**'
      - 'scripts/build-sanad-standalone.mjs'
      - '.github/workflows/sanad-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-sanad:
    name: Validate and package isolated Sanad preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static assets and reject external dependencies
        run: node scripts/build-sanad-standalone.mjs --check
      - name: Regression-test isolated build destination safeguards
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtempSync, mkdirSync, symlinkSync, writeFileSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = process.cwd();
          const temp = mkdtempSync(join(tmpdir(), 'sanad-release-check-'));
          const dist = join(root, 'dist');
          const target = join(temp, 'protected');
          mkdirSync(target);
          const marker = join(target, 'marker.txt');
          writeFileSync(marker, 'untouched');
          const link = join(dist, 'ci-symlink-guard');
          mkdirSync(dist, { recursive: true });
          try {
            symlinkSync(target, link, 'dir');
            const result = spawnSync(process.execPath, [
              'scripts/build-sanad-standalone.mjs', join(link, 'output')
            ], { cwd: root, encoding: 'utf8' });
            assert.notEqual(result.status, 0, 'Symlinked output ancestor must fail');
            assert.equal(readFileSync(marker, 'utf8'), 'untouched');
          } finally {
            rmSync(link, { force: true });
            rmSync(temp, { recursive: true, force: true });
          }
          NODE
      - name: Regression-test source asset symlink and directory rejection
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtempSync, readFileSync, rmSync, symlinkSync, mkdirSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const asset = 'sanad/sanad-demo.js';
          const original = readFileSync(asset);
          const temp = mkdtempSync(join(tmpdir(), 'sanad-source-guard-'));
          const external = join(temp, 'external.js');
          writeFileSync(external, 'const external = true;');
          const check = () => spawnSync(process.execPath,
            ['scripts/build-sanad-standalone.mjs', '--check'],
            { encoding: 'utf8' });
          try {
            rmSync(asset);
            symlinkSync(external, asset);
            assert.notEqual(check().status, 0, 'Symlinked source must fail');
            rmSync(asset);
            mkdirSync(asset);
            assert.notEqual(check().status, 0, 'Directory source must fail');
            assert.equal(readFileSync(external, 'utf8'), 'const external = true;');
          } finally {
            rmSync(asset, { recursive: true, force: true });
            writeFileSync(asset, original);
            rmSync(temp, { recursive: true, force: true });
          }
          assert.equal(check().status, 0, 'Restored source must pass');
          NODE
      - name: Build isolated static preview
        run: node scripts/build-sanad-standalone.mjs
      - name: Verify exact allowlisted output and source fidelity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdir, readFile } from 'node:fs/promises';
          const expected = ['admin.html', 'index.html', 'sanad-admin-demo.js', 'sanad-demo.js'];
          assert.deepEqual((await readdir('dist/sanad-syria')).sort(), expected);
          for (const file of expected) {
            const [source, output] = await Promise.all([
              readFile('sanad/' + file),
              readFile('dist/sanad-syria/' + file),
            ]);
            assert.deepEqual(output, source, 'Bundled file differs: ' + file);
          }
          NODE
      - name: Upload portable preview artifact (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: sanad-syria-static-preview
          path: dist/sanad-syria/
          if-no-files-found: error
          retention-days: 14
