name: Site smoke checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate storefront, seller and admin pages
        run: node tests/smoke.cjs
      - name: Test storefront wishlist, sorting and localization
        run: node tests/storefront.cjs
      - name: Test read-only seller inventory and disabled writes
        run: node tests/seller-stock.cjs
      - name: Verify seller Arabic and English language switching
        run: node tests/seller-language.cjs
      - name: Verify admin bilingual dashboard and safe shipping drafts
        run: node tests/admin-language.cjs
      - name: Check corrupted carts and browser storage failures
        run: node tests/storefront-storage.cjs
      - name: Verify language and currency preference recovery
        run: node tests/storefront-preferences.cjs
      - name: Test Sanad local demo requests
        run: node tests/sanad.cjs
      - name: Test Sanad browser-only dashboard
        run: node tests/sanad-admin.cjs
      - name: Verify public catalog adapter
        run: node tests/catalog.cjs
      - name: Verify bounded catalog read retries
        run: node tests/catalog-retry.cjs
      - name: Verify catalog image metadata safety
        run: node tests/catalog-images.cjs
      - name: Verify category pagination boundaries
        run: node tests/categories-pagination.cjs
      - name: Verify live bilingual category filters
        run: node tests/live-categories.cjs
      - name: Verify catalog refresh failures and retries
        run: node tests/catalog-refresh.cjs
      - name: Verify safe storefront markup rendering
        run: node tests/storefront-safety.cjs
