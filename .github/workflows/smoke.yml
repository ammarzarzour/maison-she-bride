name: Site smoke checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate storefront, seller and admin pages
        run: node tests/smoke.cjs
      - name: Test storefront wishlist, sorting and localization
        run: node tests/storefront.cjs
      - name: Verify Arabic and English accent-insensitive product search
        run: node tests/storefront-search.cjs
      - name: Test bilingual product photo gallery controls
        run: node tests/storefront-gallery.cjs
      - name: Test unavailable product image fallback and gallery recovery
        run: node tests/storefront-image-fallback.cjs
      - name: Test accessible cart dialog focus and keyboard controls
        run: node tests/cart-accessibility.cjs
      - name: Test bilingual quantity controls and focus after cart redraw
        run: node tests/cart-quantity-focus.cjs
      - name: Verify non-identifying bilingual demo cart quote
        run: node tests/cart-demo-quote.cjs
      - name: Test read-only seller inventory and disabled writes
        run: node tests/seller-stock.cjs
      - name: Verify seller Arabic and English language switching
        run: node tests/seller-language.cjs
      - name: Protect seller session from late authentication and inventory reads
        run: node tests/seller-session-race.cjs
      - name: Verify complete seller inventory pagination and overflow safety
        run: node tests/seller-pagination.cjs
      - name: Reject out-of-order seller inventory refresh results
        run: node tests/seller-refresh-race.cjs
      - name: Verify admin bilingual dashboard and safe shipping drafts
        run: node tests/admin-language.cjs
      - name: Verify admin session and concurrent refresh race protections
        run: node tests/admin-session-race.cjs
      - name: Check corrupted carts and browser storage failures
        run: node tests/storefront-storage.cjs
      - name: Verify language and currency preference recovery
        run: node tests/storefront-preferences.cjs
      - name: Test Sanad local demo requests
        run: node tests/sanad.cjs
      - name: Verify Sanad preview language and blocked browser storage
        run: node tests/sanad-language.cjs
      - name: Test Sanad browser-only dashboard
        run: node tests/sanad-admin.cjs
      - name: Verify public catalog adapter
        run: node tests/catalog.cjs
      - name: Verify bounded catalog read retries
        run: node tests/catalog-retry.cjs
      - name: Verify catalog image metadata safety
        run: node tests/catalog-images.cjs
      - name: Reject malformed image URL controls and surrounding whitespace
        run: node tests/catalog-image-url-controls.cjs
      - name: Verify bounded product image galleries and unique positions
        run: node tests/catalog-image-gallery.cjs
      - name: Verify category pagination boundaries
        run: node tests/categories-pagination.cjs
      - name: Verify live bilingual category filters
        run: node tests/live-categories.cjs
      - name: Verify catalog refresh failures and retries
        run: node tests/catalog-refresh.cjs
      - name: Verify catalog refresh hides stale inventory while loading
        run: node tests/catalog-refresh-pending.cjs
      - name: Verify safe storefront markup rendering
        run: node tests/storefront-safety.cjs
