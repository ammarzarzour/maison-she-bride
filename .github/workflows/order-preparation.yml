name: Order preparation tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/order-preparation.test.cjs
