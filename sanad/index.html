<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سند سوريا | Sanad Syria — Preview</title><style>:root{font-family:system-ui,Arial;background:#f3f5f4;color:#27342f}*{box-sizing:border-box}body{margin:0}header{background:#176c4c;color:white;padding:20px}header .bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:26px}small{opacity:.85}button,select,input{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid #b6c8bd;background:white;color:#164e38;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c7a44c}main{max-width:1100px;margin:28px auto;padding:0 16px}.notice{background:#fff8e4;border:1px solid #d7b966;padding:14px;border-radius:10px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #dbe2dd;border-radius:12px;padding:22px;box-shadow:0 2px 10px #0000000a}#serviceSearch{width:min(100%,420px);margin:12px 0;padding:12px;border:1px solid #b6c8bd;border-radius:8px}#searchCount{color:#65736b}.card h2{font-size:18px;margin:0 0 12px}.card p{line-height:1.6;color:#65736b}.card button{background:#176c4c;color:white}.tag{color:#96702b;font-weight:bold}section{margin:25px 0}.demo-form{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.demo-form label{flex:1;min-width:160px}.demo-form select{display:block;width:100%;margin-top:7px}.demo-form button{background:#176c4c;color:white}.demo-request{padding:15px 0;border-top:1px solid #dde5df}.demo-request strong{overflow-wrap:anywhere}.demo-status{margin:8px 0;color:#695822}.demo-actions{display:flex;gap:8px;flex-wrap:wrap}.demo-danger{color:#963f3d;border-color:#d9a6a4}.empty-demo{color:#637168}.demo-disclaimer{background:#f5f0df;padding:12px;border-radius:9px;line-height:1.6}#demoMessage{min-height:1.5em;font-weight:bold;color:#145b46}footer{padding:30px;text-align:center;color:#67756d}#status{font-weight:bold}a{color:#176c4c}</style></head><body><header><div class="bar"><div><h1 id="brand">سند سوريا</h1><small id="subtitle"></small></div><label><span id="langLabel">اللغة</span> <select id="language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select></label></div></header><main><div class="notice" id="notice" role="status"></div><section><h2 id="heading"></h2><p id="intro"></p><label for="serviceSearch" id="searchLabel"></label> <input id="serviceSearch" type="search" autocomplete="off" aria-controls="services"><p id="searchCount" aria-live="polite"></p><div class="grid" id="services"></div></section><section class="card"><h2 id="requestHeading"></h2><p id="requestIntro"></p><div id="status" aria-live="polite"></div></section><section class="card"><h2 id="adminHeading"></h2><p id="adminInfo"></p><p><a href="./admin.html" id="adminPreviewLink"></a></p></section><section class="card" aria-labelledby="demoTitle"><h2 id="demoTitle"></h2><p class="demo-disclaimer" id="demoDisclaimer"></p><form id="demoForm" class="demo-form"><label><span id="demoServiceLabel"></span><select id="demoService" required></select></label><button id="demoCreate" type="submit"></button></form><div class="demo-form" style="margin:18px 0"><label><span id="demoFilterLabel"></span><select id="demoFilter"></select></label><button type="button" id="demoClear" class="demo-danger"></button></div><div id="demoList"></div><p id="demoMessage" role="status" aria-live="polite"></p></section><section class="card"><h2 id="stepsHeading"></h2><ol id="steps"></ol></section><section class="card"><h2 id="securityHeading"></h2><p id="securityText"></p></section></main><footer id="footer"></footer><script>'use strict';const tr={ar:{subtitle:'بوابة خدمات رقمية — نسخة عرض أولية',lang:'اللغة',notice:'نسخة تجريبية غير رسمية. لا يوجد تسجيل دخول أو إرسال طلبات حقيقية أو اتصال بجهات حكومية.',heading:'الخدمات',search:'ابحث عن خدمة',count:n=>'عدد الخدمات المعروضة: '+n,empty:'لا توجد خدمات مطابقة',intro:'استعرض وحدات المنصة المقترحة. الأزرار تعرض حالة الميزة فقط.',request:'متابعة الطلبات',adminHeading:'لوحة متابعة الطلبات التجريبية',adminInfo:'تُعرض الطلبات الوهمية المحفوظة على هذا الجهاز فقط. لوحة المتابعة ليست نظام إدارة رسمياً ولا تتطلب تسجيل دخول.',adminLink:'افتح لوحة المتابعة التجريبية',requestIntro:'يمكنك تجربة محاكاة متابعة طلب وهمي بالأسفل. المتابعة الحقيقية ستُتاح بعد ربط قاعدة البيانات ونظام الصلاحيات.',stepsHeading:'مراحل معالجة الطلب',steps:['إنشاء حساب والتحقق من الهوية (قيد التطوير)','تعبئة الطلب وإرفاق المستندات (قيد التطوير)','مراجعة الطلب من الإدارة (قيد التطوير)','متابعة الحالة وإشعارات الإنجاز (قيد التطوير)'],security:'حماية البيانات',securityText:'لا تُدخل بياناتك الشخصية أو صور الوثائق في هذه النسخة. لم يُفعّل رفع المستندات أو التحقق من الهوية بعد.',footer:'سند سوريا — نموذج أولي مستقل عن الجهات الحكومية',button:'استعراض',unavailable:'هذه الخدمة قيد التطوير ولا تستقبل طلبات حالياً.',services:[['الهوية والحساب','إدارة الحسابات والتحقق من الهوية'],['الوكالات والتفويض','طلبات التفويض والوكالات'],['المستندات','رفع المستندات والتحقق منها'],['المواعيد','حجز المواعيد ومتابعتها'],['المدفوعات','الدفع مؤجّل وغير مفعّل'],['لوحة الإدارة','مراجعة الطلبات وإدارة الصلاحيات']]},en:{subtitle:'Digital services portal — early preview',lang:'Language',notice:'Unofficial demo. No real sign-in, submissions, or government integrations are available.',heading:'Services',search:'Search services',count:n=>'Services shown: '+n,empty:'No matching services',intro:'Explore planned modules. Buttons only show development status.',request:'Request tracking',adminHeading:'Demo request dashboard',adminInfo:'View fictional requests stored on this device only. This is not a real admin system and does not require login.',adminLink:'Open demo request dashboard',requestIntro:'Try the fictional request tracker below. Real requests will need database and access control integration.',stepsHeading:'Request workflow',steps:['Create account and verify identity (planned)','Complete request and attach documents (planned)','Administrative review (planned)','Track status and notifications (planned)'],security:'Data protection',securityText:'Do not enter personal data or document photos in this preview. Document uploads and identity verification are not enabled.',footer:'Sanad Syria — independent prototype, not a government service',button:'Explore',unavailable:'This service is under development and does not accept submissions yet.',services:[['Identity & accounts','Account management and identity verification'],['Authorizations','Authorization and agency requests'],['Documents','Document upload and verification'],['Appointments','Book and track appointments'],['Payments','Deferred and disabled'],['Admin console','Review requests and manage access']]}};const $=id=>document.getElementById(id);const supportedPrefs=new Set(['auto','ar','en']);let pref='auto';try{const stored=localStorage.getItem('sanad_lang');if(supportedPrefs.has(stored))pref=stored}catch(e){}function language(){return pref==='auto'?((navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en'):pref}function normalizeServiceSearch(value){return value.normalize('NFD').replace(/[\u0300-\u036f\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/[ى]/g,'ي').replace(/ة/g,'ه').toLowerCase().trim().replace(/\s+/g,' ')}function render(){const l=language(),t=tr[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('language').value=pref;for(const [id,key] of Object.entries({subtitle:'subtitle',langLabel:'lang',notice:'notice',heading:'heading',intro:'intro',requestHeading:'request',requestIntro:'requestIntro',adminHeading:'adminHeading',adminInfo:'adminInfo',adminPreviewLink:'adminLink',stepsHeading:'stepsHeading',securityHeading:'security',securityText:'securityText',footer:'footer'}))$(id).textContent=t[key];$('brand').textContent=l==='ar'?'سند سوريا':'Sanad Syria';$('steps').replaceChildren(...t.steps.map(step=>{const li=document.createElement('li');li.textContent=step;return li}));$('searchLabel').textContent=t.search;$('serviceSearch').placeholder=t.search;const q=normalizeServiceSearch($('serviceSearch').value);const filtered=t.services.filter((service,i)=>{const haystack=normalizeServiceSearch([...tr.ar.services[i],...tr.en.services[i]].join(' '));return !q||q.split(' ').every(term=>haystack.includes(term))});$('searchCount').textContent=filtered.length?t.count(filtered.length):t.empty;$('services').replaceChildren(...filtered.map(([title,desc])=>{const article=document.createElement('article');article.className='card';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=desc;const b=document.createElement('button');b.type='button';b.textContent=t.button;b.addEventListener('click',()=>{const serviceId=t.services.findIndex(x=>x[0]===title);if(serviceId>=0&&serviceId<4){$('demoService').value=String(serviceId);$('status').textContent=l==='ar'?'يمكنك تجربة محاكاة هذه الخدمة فقط، دون إرسال طلب حقيقي.':'You can simulate this service only; no real request is submitted.';$('demoTitle').scrollIntoView({behavior:'smooth'})}else{$('status').textContent=t.unavailable;$('requestHeading').scrollIntoView({behavior:'smooth'})}});article.append(h,p,b);return article}));$('status').textContent=''}$('serviceSearch').addEventListener('input',render);$('language').addEventListener('change',e=>{pref=supportedPrefs.has(e.target.value)?e.target.value:'auto';try{localStorage.setItem('sanad_lang',pref)}catch(e){}render()});render();</script><script src="sanad-demo.js?v=1"></script></body></html>
