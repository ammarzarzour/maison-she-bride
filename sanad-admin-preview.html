<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176c4c">
<title>سند سوريا | لوحة متابعة تجريبية</title>
<style>
:root{font-family:system-ui,Tahoma,Arial,sans-serif;background:#f3f5f4;color:#27342f}*{box-sizing:border-box}
body{margin:0}header{background:#176c4c;color:white;padding:20px 16px}
header .bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
h1{margin:0;font-size:26px}header a{color:#fff}small{opacity:.85}
button,select,input{font:inherit;padding:10px 13px;border-radius:8px;border:1px solid #b6c8bd;background:white;color:#164e38}
button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c7a44c;outline-offset:2px}
main{max-width:1100px;margin:26px auto;padding:0 16px}.notice{background:#fff8e4;border:1px solid #d7b966;padding:15px;border-radius:11px;line-height:1.7;margin:16px 0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.metric,.panel{background:white;border:1px solid #dbe2dd;border-radius:13px;padding:20px}
.metric span{display:block;color:#53645a}.metric strong{display:block;font-size:32px;color:#176c4c;margin-top:8px}
.panel{margin:18px 0}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.toolbar label{flex:1;min-width:170px}
.toolbar input,.toolbar select{width:100%;display:block;margin-top:7px}.toolbar button{background:#176c4c;color:white}
.table-scroll{overflow:auto}table{width:100%;min-width:650px;border-collapse:collapse}th,td{text-align:start;border-bottom:1px solid #e4eae5;padding:13px 9px;vertical-align:middle;overflow-wrap:anywhere}
th{color:#526359;font-weight:600}.state{display:inline-block;background:#f6f0dc;border-radius:20px;padding:6px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 9px}.actions .advance{background:#176c4c;color:white}.actions .remove{color:#8f3735;border-color:#d8aeac}
#message{min-height:1.4em;font-weight:600;color:#176c4c}footer{text-align:center;color:#65756b;padding:26px 15px}
@media(max-width:520px){.metric{padding:14px}h1{font-size:22px}.panel{padding:15px}}
</style>
</head>
<body>
<header><div class="bar"><div><h1 id="brand">سند سوريا</h1><small id="subtitle"></small></div>
<div><a href="./sanad-preview.html" id="backLink"></a> · <label><span id="langLabel"></span>
<select id="language" aria-label="Language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select></label></div></div></header>
<main><div id="notice" class="notice" role="note"></div>
<section aria-labelledby="overviewTitle"><h2 id="overviewTitle"></h2><div class="metrics">
<div class="metric"><span id="totalLabel"></span><strong id="totalCount">0</strong></div>
<div class="metric"><span id="draftLabel"></span><strong id="draftCount">0</strong></div>
<div class="metric"><span id="reviewLabel"></span><strong id="reviewCount">0</strong></div>
<div class="metric"><span id="doneLabel"></span><strong id="doneCount">0</strong></div>
</div></section>
<section class="panel" aria-labelledby="requestsTitle"><h2 id="requestsTitle"></h2>
<div class="toolbar"><label><span id="searchLabel"></span><input id="searchRequests" type="search" autocomplete="off" maxlength="80"></label>
<label><span id="filterLabel"></span><select id="statusFilter"></select></label>
<button id="refresh" type="button"></button></div>
<p id="resultCount" aria-live="polite"></p>
<div class="table-scroll"><table><thead><tr><th id="refHeader"></th><th id="serviceHeader"></th><th id="statusHeader"></th><th id="actionHeader"></th></tr></thead><tbody id="requestRows"></tbody></table></div>
<p id="message" role="status" aria-live="polite"></p></section>
</main><footer id="footer"></footer><script src="sanad-admin-demo.js?v=1"></script></body></html>
