<div class="top" id="topline"></div><header class="header"><div class="headrow"><a class="brand" href="#">Maison <span>She Bride</span></a><input id="search" class="search" type="search" aria-label="Search"><div class="controls"><select id="language" aria-label="Language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select><select id="currency" aria-label="Currency"><option value="SYP">SYP</option><option value="USD">USD</option><option value="SAR">SAR</option><option value="AED">AED</option></select><button id="savedToggle" type="button" aria-pressed="false">♡</button><button id="cartToggle" type="button">🛒 <span id="cartCount">0</span></button></div></div><nav class="nav" id="categories"></nav></header>
<main class="wrap"><section class="hero"><div><h1 id="heroTitle"></h1><p id="heroDesc"></p><button class="btn" id="shopNow"></button></div><div class="symbol">✦</div></section><div class="sectionhead"><h2 id="productsTitle"></h2><span class="muted" id="results"></span><div class="producttools"><label for="sortProducts" id="sortLabel"></label><select id="sortProducts"><option value="featured"></option><option value="priceAsc"></option><option value="priceDesc"></option><option value="name"></option></select><button id="refreshCatalog" type="button" class="btn" style="padding:8px 12px"></button></div></div><div class="grid" id="products"></div><nav class="catalog-pages hidden" id="catalogPages" aria-label="Product pages"><button id="prevPage" type="button"></button><span id="pageStatus" role="status" aria-live="polite"></span><button id="nextPage" type="button"></button></nav><div class="empty hidden" id="noResults"></div></main>

<script>

let categoryNames=new Map();
const tr={ar:{top:'تسوق الأزياء والإكسسوارات في مكان واحد',search:'ابحث عن منتج...',hero:'أناقتك تبدأ من هنا',desc:'تشكيلة متنوعة من الأزياء النسائية والرجالية والأطفال وفساتين الأعراس والإكسسوارات',shop:'تسوق الآن',products:'تسوق المنتجات',add:'أضف إلى السلة',cart:'سلة المشتريات',empty:'السلة فارغة',none:'لا توجد منتجات مطابقة',total:'الإجمالي',name:'الاسم الكامل',phone:'رقم الهاتف',address:'عنوان التوصيل',checkout:'إعداد الطلب',notice:'هذه نسخة عرض تجريبية. المنتجات والأسعار افتراضية، ولا يتم إرسال الطلبات أو تحصيل أي مبالغ.',foot:'تجربة متجر إلكتروني تجريبية — لا توجد عمليات بيع حقيقية حالياً.',cod:'الدفع عند الاستلام (تجريبي)',sham:'شام كاش — يدوي (غير مفعّل)',sent:'تم تجهيز ملخص الطلب التجريبي. لا يتم إرساله إلى المتجر.',qty:'منتج',stock:'المتوفر',refresh:'تحديث المنتجات',loading:'جارٍ تحديث المنتجات...',loadError:'تعذّر تحميل المنتجات، حاول مجدداً',saved:'المفضلة',save:'حفظ بالمفضلة',unsave:'إزالة من المفضلة',sort:'الترتيب',sortOptions:['الأحدث','السعر: الأقل','السعر: الأعلى','الاسم'],noCatalog:'لم تُضف منتجات منشورة بعد. يمكنك العودة لاحقاً أو تحديث القائمة.',cats:['الكل','نسائي','فساتين الأعراس','رجالي','أطفال','أحذية','حقائب','إكسسوارات','تجميل','منزل']},en:{top:'Discover fashion and accessories in one place',search:'Search products...',hero:'Your style starts here',desc:'Discover women’s, men’s and kids’ fashion, bridal gowns and accessories',shop:'Shop now',products:'Shop products',add:'Add to cart',cart:'Shopping cart',empty:'Your cart is empty',none:'No matching products',total:'Total',name:'Full name',phone:'Phone number',address:'Delivery address',checkout:'Prepare order',notice:'Demo only. Products and prices are illustrative. No orders are transmitted and no payments are collected.',foot:'Demo storefront — no real transactions are available yet.',cod:'Cash on delivery (demo)',sham:'Sham Cash — manual (not active)',sent:'Demo order summary prepared. Nothing has been submitted.',qty:'items',stock:'In stock',refresh:'Refresh products',loading:'Refreshing products...',loadError:'Could not load products. Please retry',saved:'Saved',save:'Save item',unsave:'Remove saved item',sort:'Sort',sortOptions:['Newest','Price: low to high','Price: high to low','Name'],noCatalog:'No published products yet. Please check back or refresh.',cats:['All','Women','Bridal','Men','Kids','Shoes','Bags','Accessories','Beauty','Home']}};
const $=id=>document.getElementById(id);
const categoryLabel=(slug,language)=>categoryNames.get(slug)?.[language]||tr[language].cats[categories.indexOf(slug)]||slug;
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeImage=value=>{try{const u=new URL(value);return u.protocol==='https:'?escapeHTML(u.href):''}catch{return ''}};
const maxQty=p=>Math.max(0,Math.min(99,Math.floor(Number(p?.stock)||0)));
const persistLocal=(key,value)=>{try{localStorage.setItem(key,value);return true}catch{return false}};
function readCart(){
 let saved;
 try{saved=JSON.parse(localStorage.getItem('msb_cart')||'{}')}catch{return Object.create(null)}
 if(!saved||typeof saved!=='object'||Array.isArray(saved))return Object.create(null);
 const clean=Object.create(null);
 for(const [id,qty] of Object.entries(saved)){
  if(id.length<=128&&!['__proto__','constructor','prototype'].includes(id)&&Number.isSafeInteger(qty)&&qty>0)clean[id]=Math.min(qty,99);
 }
 return clean;
}
function reconcileCart(){if(!catalogReady)return;const next=Object.create(null);for(const [id,qty] of Object.entries(cart)){const p=items.find(p=>p.id===id);if(p&&Number.isInteger(qty)&&qty>0&&maxQty(p)>0)next[id]=Math.min(qty,maxQty(p))}cart=next;persistLocal('msb_cart',JSON.stringify(cart))}

let filter='all',cart=readCart(),savedOnly=false,sortBy='featured';let catalogPage=0,catalogPageCount=1;const catalogPageSize=24;
let favorites=new Set();try{const saved=JSON.parse(localStorage.getItem('msb_favorites')||'[]');if(Array.isArray(saved))favorites=new Set(saved.filter(x=>typeof x==='string'&&x.length<100).slice(0,500))}catch(e){}
function saveFavorites(){persistLocal('msb_favorites',JSON.stringify([...favorites]))}
const rates={USD:1,SYP:120,SAR:3.75,AED:3.67}; // Illustrative rates ONLY, not market rates.
const supportedLanguages=new Set(['auto','ar','en']);
const supportedCurrencies=new Set(Object.keys(rates));
let langSetting='auto',currency='SYP';
try{
 const savedLanguage=localStorage.getItem('msb_lang');
 const savedCurrency=localStorage.getItem('msb_currency');
 if(supportedLanguages.has(savedLanguage))langSetting=savedLanguage;
 if(supportedCurrencies.has(savedCurrency))currency=savedCurrency;
}catch(e){}
function lang(){return langSetting==='auto'?((navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en'):langSetting}
function t(){return tr[lang()]}function price(usd){return new Intl.NumberFormat(lang()==='ar'?'ar-SY':'en-US',{maximumFractionDigits:currency==='SYP'?0:2}).format(usd*rates[currency])+' '+currency}
function render(){let l=lang(),tx=t();document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('language').value=langSetting;$('currency').value=currency;$('topline').textContent=tx.top;$('search').placeholder=tx.search;$('heroTitle').textContent=tx.hero;$('heroDesc').textContent=tx.desc;$('shopNow').textContent=tx.shop;$('productsTitle').textContent=tx.products;$('refreshCatalog').textContent=tx.refresh;$('savedToggle').textContent='♡ '+tx.saved+' ('+items.filter(p=>favorites.has(p.id)).length+')';$('savedToggle').setAttribute('aria-pressed',String(savedOnly));$('sortLabel').textContent=tx.sort;$('sortProducts').value=sortBy;[...$('sortProducts').options].forEach((o,i)=>o.textContent=tx.sortOptions[i]);$('noResults').textContent=tx.none;$('cartTitle').textContent=tx.cart;$('checkoutNotice').textContent=tx.notice+' '+(l==='ar'?'أسعار الصرف للعرض فقط وليست أسعاراً حقيقية.':'Exchange rates are placeholders, not live rates.');$('footText').textContent=tx.foot;$('demoNotice').textContent='© 2026 Maison She Bride';$('customerName').placeholder=tx.name;$('customerPhone').placeholder=tx.phone;$('customerAddress').placeholder=tx.address;$('checkoutBtn').textContent=tx.checkout;$('payment').options[0].textContent=tx.cod;$('payment').options[1].textContent=tx.sham;$('categories').innerHTML=categories.map((c,i)=>'<button type="button" data-cat="'+escapeHTML(c)+'" class="'+(filter===c?'active':'')+'">'+escapeHTML(categoryLabel(c,l))+'</button>').join('');let query=$('search').value.trim().toLocaleLowerCase();let filtered=items.filter(p=>(filter==='all'||p.cat===filter)&&(!savedOnly||favorites.has(p.id))&&(!query||(p.ar+' '+p.en).toLocaleLowerCase().includes(query)));if(sortBy==='priceAsc')filtered.sort((a,b)=>a.usd-b.usd);else if(sortBy==='priceDesc')filtered.sort((a,b)=>b.usd-a.usd);else if(sortBy==='name')filtered.sort((a,b)=>a[l].localeCompare(b[l],l));const totalPages=Math.max(1,Math.ceil(filtered.length/catalogPageSize));catalogPageCount=totalPages;catalogPage=Math.min(catalogPage,totalPages-1);const visible=filtered.slice(catalogPage*catalogPageSize,(catalogPage+1)*catalogPageSize);$('results').textContent=catalogError?tx.loadError:filtered.length+' '+tx.qty;$('catalogPages').classList.toggle('hidden',totalPages<=1);$('prevPage').textContent=l==='ar'?'السابق':'Previous';$('nextPage').textContent=l==='ar'?'التالي':'Next';$('prevPage').disabled=catalogPage===0;$('nextPage').disabled=catalogPage>=totalPages-1;$('pageStatus').textContent=l==='ar'?'الصفحة '+(catalogPage+1)+' من '+totalPages:'Page '+(catalogPage+1)+' of '+totalPages;$('noResults').textContent=catalogError?tx.loadError:(items.length===0?tx.noCatalog:tx.none);$('noResults').classList.toggle('hidden',filtered.length>0);$('products').innerHTML=visible.map(p=>'<article class="card"><div class="visual" aria-hidden="true">'+(safeImage(p.image)?'<img src="'+safeImage(p.image)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':escapeHTML(p.icon))+'</div><div class="cardbody"><span class="tag">'+(escapeHTML(categoryLabel(p.cat,l)))+'</span><h3>'+escapeHTML(p[l])+'</h3><div class="price">'+price(p.usd)+'</div><small class="muted">'+tx.stock+': '+maxQty(p)+'</small><button type="button" data-add="'+escapeHTML(p.id)+'">'+tx.add+'</button><button type="button" class="save" aria-pressed="'+favorites.has(p.id)+'" data-save="'+escapeHTML(p.id)+'">'+(favorites.has(p.id)?'♥ '+tx.unsave:'♡ '+tx.save)+'</button></div></article>').join('');renderCart()}
function renderCart(){let tx=t(),sum=0,count=0;reconcileCart();let rows=Object.entries(cart).filter(([id,q])=>items.some(p=>p.id==id)&&Number.isInteger(q)&&q>0).map(([id,q])=>{let p=items.find(p=>p.id==id);sum+=p.usd*q;count+=q;return '<div class="cartitem"><div><b>'+escapeHTML(p[lang()])+'</b><br><small>'+price(p.usd*q)+'</small></div><div><button data-minus="'+escapeHTML(id)+'">−</button> '+q+' <button data-plus="'+escapeHTML(id)+'">+</button></div></div>'});$('cartItems').innerHTML=rows.join('')||'<p>'+escapeHTML(tx.empty)+'</p>';$('cartCount').textContent=count;$('cartTotal').textContent=tx.total+': '+price(sum);$('checkoutForm').classList.add('hidden');persistLocal('msb_cart',JSON.stringify(cart))}
function openCart(show){$('overlay').classList.toggle('show',show);$('drawer').classList.toggle('open',show)}
$('categories').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b){filter=b.dataset.cat;catalogPage=0;render()}});$('products').addEventListener('click',e=>{const saved=e.target.closest('[data-save]');if(saved){const id=saved.dataset.save;if(!items.some(p=>p.id===id))return;if(favorites.has(id))favorites.delete(id);else favorites.add(id);saveFavorites();render();return}let b=e.target.closest('[data-add]');if(b){let id=b.dataset.add;const p=items.find(x=>x.id===id);if(!p)return;cart[id]=Math.min(maxQty(p),(cart[id]||0)+1);renderCart();openCart(true)}});$('cartItems').addEventListener('click',e=>{let plus=e.target.closest('[data-plus]'),minus=e.target.closest('[data-minus]');if(plus){const id=plus.dataset.plus,p=items.find(x=>x.id===id);if(p)cart[id]=Math.min(maxQty(p),(cart[id]||0)+1)}if(minus){let id=minus.dataset.minus;cart[id]--;if(cart[id]<=0)delete cart[id]}renderCart()});$('savedToggle').onclick=()=>{savedOnly=!savedOnly;catalogPage=0;render();$('productsTitle').scrollIntoView({behavior:'smooth'})};$('sortProducts').onchange=e=>{sortBy=e.target.value;catalogPage=0;render()};$('prevPage').onclick=()=>{if(catalogPage>0){catalogPage--;render();$('productsTitle').scrollIntoView({behavior:'smooth'})}};$('nextPage').onclick=()=>{if(catalogPage<catalogPageCount-1){catalogPage++;render();$('productsTitle').scrollIntoView({behavior:'smooth'})}};$('cartToggle').onclick=()=>openCart(true);$('closeCart').onclick=()=>openCart(false);$('overlay').onclick=()=>openCart(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')openCart(false)});$('search').addEventListener('input',()=>{catalogPage=0;render()});$('shopNow').onclick=()=>$('productsTitle').scrollIntoView({behavior:'smooth'});$('language').onchange=e=>{langSetting=supportedLanguages.has(e.target.value)?e.target.value:'auto';try{localStorage.setItem('msb_lang',langSetting)}catch(e){}render()};$('currency').onchange=e=>{currency=supportedCurrencies.has(e.target.value)?e.target.value:'SYP';try{localStorage.setItem('msb_currency',currency)}catch(e){}render()};$('checkoutForm').onsubmit=e=>{e.preventDefault();$('checkoutMessage').textContent=t().sent};render();
</script><script>window.MSB_SUPABASE={url:'https://cymwmswpseevemxtugdb.supabase.co',publishableKey:'sb_publishable_OevT9B8LeDvgIzOWtktYTA__LpPRQBE'};</script>

<script>
let catalogLoading=false;
function catalogLoadFailed(){
 catalogError=true;catalogReady=false;items=[];render();
 $('results').textContent=t().loadError;
 $('noResults').textContent=t().loadError;
 $('noResults').classList.remove('hidden');
 $('checkoutNotice').textContent=t().loadError;
}
async function refreshCatalog(){
 if(catalogLoading)return;
 const api=window.MSB_CATALOG;
 if(!api||!api.configured){catalogLoadFailed();return;}
 catalogLoading=true;$('refreshCatalog').disabled=true;$('results').textContent=t().loading;
 try{
  const [result,categoryResult]=await Promise.all([api.products(),api.categories()]);
  if(result.error||categoryResult.error||!result.configured||!categoryResult.configured||!Array.isArray(result.rows)||!Array.isArray(categoryResult.rows)){catalogLoadFailed();return;}
  // Never mislabel orphaned products as the 'all' category.
  const categoryIds=new Set(categoryResult.rows.map(c=>c.id));
  if(result.rows.some(p=>!categoryIds.has(p.category_id))){catalogLoadFailed();return;}
  const slugs=new Map(categoryResult.rows.map(c=>[c.id,c.slug]));
  categoryNames=new Map(categoryResult.rows.map(c=>[c.slug,{ar:c.name_ar,en:c.name_en}]));
  categories=['all',...categoryResult.rows.map(c=>c.slug)];
  if(!categories.includes(filter))filter='all';
  catalogError=false;catalogPage=0;items=result.rows.map(p=>({id:p.id,cat:slugs.get(p.category_id)||'all',ar:p.title_ar,en:p.title_en,usd:Number(p.price_usd),stock:Number(p.stock),icon:'🛍️',image:(Array.isArray(p.product_images)?p.product_images.slice().sort((a,b)=>a.position-b.position)[0]?.image_url:null)}));
  catalogReady=true;reconcileCart();render();
  $('checkoutNotice').textContent=lang()==='ar'?'المنتجات من قاعدة البيانات الحقيقية. الطلبات والدفع غير مفعّلين حالياً.':'Products are from the live database. Checkout and payments are not enabled.';
  $('demoNotice').textContent=lang()==='ar'?'الكتالوج متصل بقاعدة البيانات؛ الشراء غير مفعّل':'Live catalog connected; purchases disabled';
 }catch(e){catalogLoadFailed();}
 finally{catalogLoading=false;$('refreshCatalog').disabled=false;}
}
$('refreshCatalog').addEventListener('click',refreshCatalog);
refreshCatalog();
</script></body></html>
