<style>

gap:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.gallery-choices{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.gallery-choices button{min-width:32px;padding:5px 8px;background:#fff;color:var(--green);border:1px solid var(--line);border-radius:7px}.gallery-choices button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.gallery-choices button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.visual{height:180px;background:linear-gradient(145deg,#f1e9db,#dce8e0);display:grid;place-items:center;font-size:65px}.cardbody{padding:14px}.tag{color:var(--green);font-size:12px}.card h3{font-size:16px;min-height:45px;margin:8px 0}.price{font-weight:800;color:var(--green);margin:10px 0}.muted{color:#6b7770;font-size:13px}.card button{width:100%;border:0;background:var(--green);color:white;border-radius:9px;padding:11px}.card button.save{background:#f4f7f3;color:var(--green);border:1px solid #d4e2d9;margin:7px 0}.card button.save[aria-pressed=true]{background:#fff5e1;border-color:var(--gold)}.producttools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.producttools select{padding:9px;border-radius:9px;border:1px solid var(--line);background:white;max-width:180px}.controls button[aria-pressed=true]{background:var(--gold);color:#1d2a23;border-color:var(--gold)}.empty{text-align:center;padding:35px;color:#6b7770}.footer{background:#102d23;color:white;margin-top:35px;padding:30px 18px;text-align:center;line-height:1.9}.overlay{position:fixed;inset:0;background:#0008;z-index:9;display:none}.overlay.show{display:block}.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100vw);background:white;z-index:10;transform:translateX(-110%);transition:transform .2s;padding:20px;overflow:auto;box-shadow:0 0 25px #0002}.drawer.open{transform:translateX(0)}html[dir=ltr] .drawer{transform:translateX(110%)}html[dir=ltr] .drawer.open{transform:translateX(0)}.cartitem{display:flex;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}.cartitem button{border:1px solid var(--line);background:white;border-radius:7px}.field{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0}.notice{background:#fff7e2;border:1px solid #e9d6a4;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.catalog-pages{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}.catalog-pages button{border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:white;color:var(--green)}.catalog-pages button:disabled{opacity:.45;cursor:not-allowed}.catalog-pages span{font-size:14px;color:var(--text)}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.visual{height:145px}.hero .symbol{display:none}}@media(max-width:430px){.headrow{gap:8px}.brand{font-size:20px}.search{order:3;flex-basis:100%}.grid{gap:10px}.cardbody{padding:10px}.visual{height:120px;font-size:45px}.hero{padding:26px 20px}}

<div class="top" id="topline"></div><header class="header"><div class="headrow"><a class="brand" href="#">Maison <span>She Bride</span></a><input id="search" class="search" type="search" aria-label="Search"><div class="controls"><select id="language" aria-label="Language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select><select id="currency" aria-label="Currency"><option value="SYP">SYP</option><option value="USD">USD</option><option value="SAR">SAR</option><option value="AED">AED</option></select><button id="savedToggle" type="button" aria-pressed="false">♡</button><button id="cartToggle" aria-expanded="false" aria-controls="drawer" type="button">🛒 <span id="cartCount">0</span></button></div></div><nav class="nav" id="categories"></nav></header>

<script>
'use strict';
let items=[];
let catalogReady=false;
let catalogError=false;
let catalogLoading=false;
let categories=['all','women','bridal','men','kids','shoes','bags','accessories','beauty','home'];
const gallerySelection=new Map(); // In-memory only; no product browsing history is stored.
let categoryNames=new Map();
const tr={ar:{top:'تسوق الأزياء والإكسسوارات في مكان واحد',search:'ابحث عن منتج...',hero:'أناقتك تبدأ من هنا',desc:'تشكيلة متنوعة من الأزياء النسائية والرجالية والأطفال وفساتين الأعراس والإكسسوارات',shop:'تسوق الآن',products:'تسوق المنتجات',add:'أضف إلى السلة',cart:'سلة المشتريات',empty:'السلة فارغة',none:'لا توجد منتجات مطابقة',total:'الإجمالي',name:'الاسم الكامل',phone:'رقم الهاتف',address:'عنوان التوصيل',checkout:'إعداد الطلب',notice:'هذه نسخة عرض تجريبية. المنتجات والأسعار افتراضية، ولا يتم إرسال الطلبات أو تحصيل أي مبالغ.',foot:'تجربة متجر إلكتروني تجريبية — لا توجد عمليات بيع حقيقية حالياً.',cod:'الدفع عند الاستلام (تجريبي)',sham:'شام كاش — يدوي (غير مفعّل)',sent:'تم تجهيز ملخص الطلب التجريبي. لا يتم إرساله إلى المتجر.',increase:'زيادة كمية',decrease:'تقليل كمية',quantity:'الكمية',quoteHeading:'ملخص السلة التجريبي (بدون بيانات شخصية)',copyQuote:'نسخ ملخص السلة',quoteEmpty:'أضف منتجات لعرض ملخص تجريبي.',quoteCopied:'تم نسخ الملخص التجريبي؛ لم يتم إرسال طلب.',quoteCopyFailed:'تعذّر النسخ التلقائي. يمكنك تحديد النص ونسخه يدوياً.',quoteDisclaimer:'تجربة فقط — أسعار التحويل تقريبية، لا طلبات أو دفع حقيقي.',qty:'منتج',stock:'المتوفر',soldOut:'نفدت الكمية',refresh:'تحديث المنتجات',loading:'جارٍ تحديث المنتجات...',loadError:'تعذّر تحميل المنتجات، حاول مجدداً',saved:'المفضلة',save:'حفظ بالمفضلة',unsave:'إزالة من المفضلة',sort:'الترتيب',sortOptions:['الأحدث','السعر: الأقل','السعر: الأعلى','الاسم'],noCatalog:'لم تُضف منتجات منشورة بعد. يمكنك العودة لاحقاً أو تحديث القائمة.',cats:['الكل','نسائي','فساتين الأعراس','رجالي','أطفال','أحذية','حقائب','إكسسوارات','تجميل','منزل']},en:{top:'Discover fashion and accessories in one place',search:'Search products...',hero:'Your style starts here',desc:'Discover women’s, men’s and kids’ fashion, bridal gowns and accessories',shop:'Shop now',products:'Shop products',add:'Add to cart',cart:'Shopping cart',empty:'Your cart is empty',none:'No matching products',total:'Total',name:'Full name',phone:'Phone number',address:'Delivery address',checkout:'Prepare order',notice:'Demo only. Products and prices are illustrative. No orders are transmitted and no payments are collected.',foot:'Demo storefront — no real transactions are available yet.',cod:'Cash on delivery (demo)',sham:'Sham Cash — manual (not active)',sent:'Demo order summary prepared. Nothing has been submitted.',increase:'Increase quantity of',decrease:'Decrease quantity of',quantity:'Quantity',quoteHeading:'Demo cart summary (no personal details)',copyQuote:'Copy demo cart summary',quoteEmpty:'Add products to see a sample summary.',quoteCopied:'Demo summary copied; no order was submitted.',quoteCopyFailed:'Automatic copy is unavailable. Select the text and copy it manually.',quoteDisclaimer:'Demo only — exchange rates are illustrative. No real orders or payments.',qty:'items',stock:'In stock',soldOut:'Out of stock',refresh:'Refresh products',loading:'Refreshing products...',loadError:'Could not load products. Please retry',saved:'Saved',save:'Save item',unsave:'Remove saved item',sort:'Sort',sortOptions:['Newest','Price: low to high','Price: high to low','Name'],noCatalog:'No published products yet. Please check back or refresh.',cats:['All','Women','Bridal','Men','Kids','Shoes','Bags','Accessories','Beauty','Home']}};
const $=id=>document.getElementById(id);
const categoryLabel=(slug,language)=>categoryNames.get(slug)?.[language]||tr[language].cats[categories.indexOf(slug)]||slug;
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeImage=value=>{try{const u=new URL(value);return u.protocol==='https:'?escapeHTML(u.href):''}catch{return ''}};
const maxQty=p=>Math.max(0,Math.min(99,Math.floor(Number(p?.stock)||0)));
const persistLocal=(key,value)=>{try{localStorage.setItem(key,value);return true}catch{return false}};
function readCart(){
 let saved;
 try{saved=JSON.parse(localStorage.getItem('msb_cart')||'{}')}catch{return Object.create(null)}
 if(!saved||typeof saved!=='object'||Array.isArray(saved))return Object.create(null);
 const clean=Object.create(null);
 for(const [id,qty] of Object.entries(saved)){
  if(id.length<=128&&!['__proto__','constructor','prototype'].includes(id)&&Number.isSafeInteger(qty)&&qty>0)clean[id]=Math.min(qty,99);
 }
 return clean;
}
function reconcileCart(){if(!catalogReady)return;const next=Object.create(null);for(const [id,qty] of Object.entries(cart)){const p=items.find(p=>p.id===id);if(p&&Number.isInteger(qty)&&qty>0&&maxQty(p)>0)next[id]=Math.min(qty,maxQty(p))}cart=next;persistLocal('msb_cart',JSON.stringify(cart))}

let filter='all',cart=readCart(),savedOnly=false,sortBy='featured';let catalogPage=0,catalogPageCount=1;const catalogPageSize=24;
let favorites=new Set();try{const saved=JSON.parse(localStorage.getItem('msb_favorites')||'[]');if(Array.isArray(saved))favorites=new Set(saved.filter(x=>typeof x==='string'&&x.length<100).slice(0,500))}catch(e){}
function saveFavorites(){persistLocal('msb_favorites',JSON.stringify([...favorites]))}
const rates={USD:1,SYP:120,SAR:3.75,AED:3.67}; // Illustrative rates ONLY, not market rates.
const supportedLanguages=new Set(['auto','ar','en']);
const supportedCurrencies=new Set(Object.keys(rates));
let langSetting='auto',currency='SYP';
try{
 const savedLanguage=localStorage.getItem('msb_lang');
 const savedCurrency=localStorage.getItem('msb_currency');
 if(supportedLanguages.has(savedLanguage))langSetting=savedLanguage;
 if(supportedCurrencies.has(savedCurrency))currency=savedCurrency;
}catch(e){}
function lang(){return langSetting==='auto'?((navigator.language||'en').toLowerCase().startsWith('ar')?'ar':'en'):langSetting}
function t(){return tr[lang()]}function price(usd){return new Intl.NumberFormat(lang()==='ar'?'ar-SY':'en-US',{maximumFractionDigits:currency==='SYP'?0:2}).format(usd*rates[currency])+' '+currency}
function normalizeSearch(value){
 return String(value||'').normalize('NFKD')
  .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
  .replace(/[\u0622\u0623\u0625\u0671]/g,'ا')
  .replace(/\u0649/g,'ي')
  .replace(/\u0624/g,'و')
  .replace(/\u0626/g,'ي')
  .replace(/\u0629/g,'ه')
  .replace(/[\u0300-\u036f]/g,'')
  .toLocaleLowerCase().replace(/\s+/g,' ').trim();
}
function render(){let l=lang(),tx=t();document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('language').value=langSetting;$('currency').value=currency;$('topline').textContent=tx.top;$('search').placeholder=tx.search;$('heroTitle').textContent=tx.hero;$('heroDesc').textContent=tx.desc;$('shopNow').textContent=tx.shop;$('productsTitle').textContent=tx.products;$('refreshCatalog').textContent=tx.refresh;$('savedToggle').textContent='♡ '+tx.saved+' ('+items.filter(p=>favorites.has(p.id)).length+')';$('savedToggle').setAttribute('aria-pressed',String(savedOnly));$('sortLabel').textContent=tx.sort;$('sortProducts').value=sortBy;[...$('sortProducts').options].forEach((o,i)=>o.textContent=tx.sortOptions[i]);$('noResults').textContent=tx.none;$('cartTitle').textContent=tx.cart;$('checkoutNotice').textContent=catalogError?tx.loadError:catalogLoading?tx.loading:catalogReady?(l==='ar'?'المنتجات من قاعدة البيانات الحقيقية. الطلبات والدفع غير مفعّلين حالياً.':'Products are from the live database. Checkout and payments are not enabled.'):tx.notice+' '+(l==='ar'?'أسعار الصرف للعرض فقط وليست أسعاراً حقيقية.':'Exchange rates are placeholders, not live rates.');$('footText').textContent=tx.foot;$('demoNotice').textContent=catalogReady?(l==='ar'?'الكتالوج متصل بقاعدة البيانات؛ الشراء غير مفعّل':'Live catalog connected; purchases disabled'):'© 2026 Maison She Bride';$('quoteLabel').textContent=tx.quoteHeading;$('copyQuote').textContent=tx.copyQuote;$('categories').innerHTML=categories.map((c,i)=>'<button type="button" data-cat="'+escapeHTML(c)+'" class="'+(filter===c?'active':'')+'">'+escapeHTML(categoryLabel(c,l))+'</button>').join('');let query=normalizeSearch($('search').value);let filtered=items.filter(p=>(filter==='all'||p.cat===filter)&&(!savedOnly||favorites.has(p.id))&&(!query||query.split(' ').every(term=>normalizeSearch([p.ar,p.en,p.descriptionAr||'',p.descriptionEn||'',categoryLabel(p.cat,'ar'),categoryLabel(p.cat,'en')].join(' ')).includes(term))));if(sortBy==='priceAsc')filtered.sort((a,b)=>a.usd-b.usd);else if(sortBy==='priceDesc')filtered.sort((a,b)=>b.usd-a.usd);else if(sortBy==='name')filtered.sort((a,b)=>a[l].localeCompare(b[l],l));const totalPages=Math.max(1,Math.ceil(filtered.length/catalogPageSize));catalogPageCount=totalPages;catalogPage=Math.min(catalogPage,totalPages-1);const visible=filtered.slice(catalogPage*catalogPageSize,(catalogPage+1)*catalogPageSize);$('results').textContent=catalogError?tx.loadError:catalogLoading?tx.loading:filtered.length+' '+tx.qty;$('catalogPages').classList.toggle('hidden',totalPages<=1);$('prevPage').textContent=l==='ar'?'السابق':'Previous';$('nextPage').textContent=l==='ar'?'التالي':'Next';$('prevPage').disabled=catalogPage===0;$('nextPage').disabled=catalogPage>=totalPages-1;$('pageStatus').textContent=l==='ar'?'الصفحة '+(catalogPage+1)+' من '+totalPages:'Page '+(catalogPage+1)+' of '+totalPages;$('noResults').textContent=catalogError?tx.loadError:catalogLoading?tx.loading:(items.length===0?tx.noCatalog:tx.none);$('noResults').classList.toggle('hidden',filtered.length>0);$('products').innerHTML=visible.map(p=>{const images=Array.isArray(p.images)?p.images:[];const index=Math.min(Math.max(gallerySelection.get(p.id)||0,0),Math.max(0,images.length-1));const current=images[index]||p.image;const controls=images.length>1?'<div class="gallery-choices" role="group" aria-label="'+escapeHTML((l==='ar'?'صور المنتج ':'Product photos ')+p[l])+'">'+images.map((url,i)=>'<button type="button" data-photo="'+escapeHTML(p.id)+'" data-photo-index="'+i+'" aria-label="'+escapeHTML((l==='ar'?'عرض الصورة ':'Show photo ')+(i+1)+(l==='ar'?' من ':' of ')+images.length)+'" aria-pressed="'+(index===i)+'">'+(i+1)+'</button>').join('')+'</div>':'';return '<article class="card"><div class="visual">'+(safeImage(current)?'<img src="'+safeImage(current)+'" alt="'+escapeHTML(p[l])+'" loading="lazy" style="width:100%;height:100%;object-fit:cover"><span data-image-fallback hidden aria-hidden="true">'+escapeHTML(p.icon)+'</span>':escapeHTML(p.icon))+'</div><div class="cardbody">'+controls+'<span class="tag">'+escapeHTML(categoryLabel(p.cat,l))+'</span><h3>'+escapeHTML(p[l])+'</h3><div class="price">'+price(p.usd)+'</div><small class="muted">'+tx.stock+': '+maxQty(p)+'</small><button type="button" data-add="'+escapeHTML(p.id)+'"'+(maxQty(p)===0?' disabled aria-disabled="true"':'')+'>'+(maxQty(p)===0?(l==='ar'?'نفدت الكمية':'Out of stock'):tx.add)+'</button><button type="button" class="save" aria-pressed="'+favorites.has(p.id)+'" data-save="'+escapeHTML(p.id)+'">'+(favorites.has(p.id)?'♥ '+tx.unsave:'♡ '+tx.save)+'</button></div></article>'}).join('');renderCart()}
function cartQuoteText(){
 if(!catalogReady)return '';
 let sum=0,count=0;
 const lines=[];
 for(const [id,qty] of Object.entries(cart)){
  const product=items.find(p=>p.id===id);
  if(!product||!Number.isInteger(qty)||qty<=0||qty>maxQty(product))continue;
  const title=String(product[lang()]||'').replace(/\s+/g,' ').trim();
  sum+=product.usd*qty;count+=qty;
  lines.push('- '+title+' × '+qty+' — '+price(product.usd*qty));
 }
 if(!count)return '';
 return [t().quoteHeading,...lines,t().total+': '+price(sum),t().quoteDisclaimer].join('\n');
}
function renderCart(){let tx=t(),sum=0,count=0;reconcileCart();let rows=Object.entries(cart).filter(([id,q])=>items.some(p=>p.id==id)&&Number.isInteger(q)&&q>0).map(([id,q])=>{let p=items.find(p=>p.id==id);sum+=p.usd*q;count+=q;return '<div class="cartitem"><div><b>'+escapeHTML(p[lang()])+'</b><br><small>'+price(p.usd*q)+'</small></div><div><button type="button" aria-label="'+escapeHTML(tx.decrease+' '+p[lang()])+'" data-minus="'+escapeHTML(id)+'">−</button> <span aria-label="'+escapeHTML(tx.quantity+' '+q)+'">'+q+'</span> <button type="button" aria-label="'+escapeHTML(tx.increase+' '+p[lang()])+'" data-plus="'+escapeHTML(id)+'">+</button></div></div>'});$('cartItems').innerHTML=rows.join('')||'<p>'+escapeHTML(tx.empty)+'</p>';$('cartCount').textContent=count;$('cartTotal').textContent=tx.total+': '+price(sum);$('checkoutForm').classList.add('hidden');const summary=cartQuoteText();$('quotePreview').value=summary||tx.quoteEmpty;$('copyQuote').disabled=!summary;$('checkoutMessage').textContent='';persistLocal('msb_cart',JSON.stringify(cart))}
let cartPreviousFocus=null;
function openCart(show){
 const drawer=$('drawer');
 if(show){
  if(!drawer.classList.contains('open'))cartPreviousFocus=document.activeElement;
  $('overlay').classList.add('show');drawer.classList.add('open');
  $('cartToggle').setAttribute('aria-expanded','true');
  $('closeCart').focus();
 }else{
  const wasOpen=drawer.classList.contains('open');
  $('overlay').classList.remove('show');drawer.classList.remove('open');
  $('cartToggle').setAttribute('aria-expanded','false');
  if(wasOpen){
   const target=cartPreviousFocus;
   cartPreviousFocus=null;
   if(target&&typeof target.focus==='function'&&target.isConnected!==false)target.focus();
   else $('cartToggle').focus();
  }
 }
}
function trapCartFocus(event){
 if(event.key!=='Tab'||!$('drawer').classList.contains('open'))return;
 const focusable=[...$('drawer').querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length>0);
 if(!focusable.length){event.preventDefault();$('closeCart').focus();return;}
 const first=focusable[0],last=focusable.at(-1);
 if(event.shiftKey&&(document.activeElement===first||!$('drawer').contains(document.activeElement))){event.preventDefault();last.focus();}
