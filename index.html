<!-- Maison She Bride - Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* الخط الأساسي */
body {
  font-family: 'Cairo', sans-serif;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.9;
}

/* اسم المتجر */
header h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(34px, 7vw, 52px);
  font-weight: 800;
  line-height: 1.3;
  color: #d4af37;
}

/* الوصف تحت اسم المتجر */
header p {
  font-family: 'Cairo', sans-serif;
  font-size: 22px;
  font-weight: 700;
}

/* العناوين */
main h2 {
  font-family: 'Cairo', sans-serif;
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 800;
}

/* النصوص */
main p {
  font-family: 'Cairo', sans-serif;
  font-size: 21px;
  font-weight: 600;
}

/* الأزرار */
button {
  font-family: 'Cairo', sans-serif;
  font-size: 21px;
  font-weight: 800;
  padding: 17px 34px;
}

/* التوافق مع الموبايل */
@media (max-width: 480px) {
  header p {
    font-size: 19px;
  }

  main p {
    font-size: 19px;
  }

  button {
    font-size: 19px;
  }
}
</style>
