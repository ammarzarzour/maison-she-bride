<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#145b46"><title>Maison She Bride | متجر الأزياء</title>
<style>
:root{--green:#145b46;--gold:#c5a24b;--bg:#f7f8f6;--line:#e3e7e2;--text:#1e2b26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{background:var(--green);color:white;text-align:center;padding:9px;font-size:13px}.header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.headrow{max-width:1200px;margin:auto;display:flex;gap:14px;align-items:center;padding:13px 18px;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:25px;font-weight:bold;color:var(--green);white-space:nowrap}.brand span{color:var(--gold)}.search{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}.controls{display:flex;gap:7px;align-items:center}.controls select,.controls button{border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.controls button{background:var(--green);color:white;border-color:var(--green)}.nav{display:flex;overflow:auto;gap:8px;padding:10px 18px;max-width:1200px;margin:auto}.nav button{border:1px solid var(--line);background:white;border-radius:25px;padding:8px 15px;white-space:nowrap}.nav button.active{background:var(--green);color:white}.wrap{max-width:1200px;margin:auto;padding:20px 18px}.hero{background:linear-gradient(115deg,#104432,#24775d);color:white;border-radius:20px;padding:38px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(28px,5vw,49px);margin:0 0 12px}.hero p{line-height:1.8}.hero .symbol{font-size:70px;color:var(--gold)}.btn{background:var(--gold);border:0;border-radius:11px;padding:12px 20px;font-weight:700;color:#1d2a23}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 15px}.sectionhead h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.visual{height:180px;background:linear-gradient(145deg,#f1e9db,#dce8e0);display:grid;place-items:center;font-size:65px}.cardbody{padding:14px}.tag{color:var(--green);font-size:12px}.card h3{font-size:16px;min-height:45px;margin:8px 0}.price{font-weight:800;color:var(--green);margin:10px 0}.muted{color:#6b7770;font-size:13px}.card button{width:100%;border:0;background:var(--green);color:white;border-radius:9px;padding:11px}.empty{text-align:center;padding:35px;color:#6b7770}.footer{background:#102d23;color:white;margin-top:35px;padding:30px 18px;text-align:center;line-height:1.9}.overlay{position:fixed;inset:0;background:#0008;z-index:9;display:none}.overlay.show{display:block}.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100vw);background:white;z-index:10;transform:translateX(-110%);transition:transform .2s;padding:20px;overflow:auto;box-shadow:0 0 25px #0002}.drawer.open{transform:translateX(0)}html[dir=ltr] .drawer{transform:translateX(110%)}html[dir=ltr] .drawer.open{transform:translateX(0)}.cartitem{display:flex;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}.cartitem button{border:1px solid var(--line);background:white;border-radius:7px}.field{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:9px 0}.notice{background:#fff7e2;border:1px solid #e9d6a4;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.visual{height:145px}.hero .symbol{display:none}}@media(max-width:430px){.headrow{gap:8px}.brand{font-size:20px}.search{order:3;flex-basis:100%}.grid{gap:10px}.cardbody{padding:10px}.visual{height:120px;font-size:45px}.hero{padding:26px 20px}}
</style></head><body>
<div class="top" id="topline"></div><header class="header"><div class="headrow"><a class="brand" href="#">Maison <span>She Bride</span></a><input id="search" class="search" type="search" aria-label="Search"><div class="controls"><select id="language" aria-label="Language"><option value="auto">🌐 Auto</option><option value="ar">العربية</option><option value="en">English</option></select><select id="currency" aria-label="Currency"><option value="SYP">SYP</option><option value="USD">USD</option><option value="SAR">SAR</option><option value="AED">AED</option></select><button id="cartToggle" type="button">🛒 <span id="cartCount">0</span></button></div></div><nav class="nav" id="categories"></nav></header>
<main class="wrap"><section class="hero"><div><h1 id="heroTitle"></h1><p id="heroDesc"></p><button class="btn" id="shopNow"></button></div><div class="symbol">✦</div></section><div class="sectionhead"><h2 id="productsTitle"></h2><span class="muted" id="results"></span></div><div class="grid" id="products"></div><div class="empty hidden" id="noResults"></div></main>
<footer class="footer"><strong>Maison She Bride</strong><div id="footText"></div><small id="demoNotice"></small></footer>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Shopping cart"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="cartTitle"></h2><button id="closeCart" class="btn" type="button">✕</button></div><div id="cartItems"></div><h3 id="cartTotal"></h3><div class="notice" id="checkoutNotice"></div><form id="checkoutForm"><input class="field" id="customerName" required autocomplete="name"><input class="field" id="customerPhone" required type="tel" autocomplete="tel"><textarea class="field" id="customerAddress" required rows="3"></textarea><select class="field" id="payment"><option value="cod"></option><option value="sham"></option></select><button class="btn" type="submit" id="checkoutBtn" style="width:100%"></button></form><p class="muted" id="checkoutMessage" role="status"></p></aside>
<script>
'use strict';
let items=[];
let categories=['all','women','bridal','men','kids','shoes','bags','accessories','beauty','home'];
const tr={ar:{top:'تسوق الأزياء والإكسسوارات في مكان واحد',search:'ابحث عن منتج...',hero:'أناقتك تبدأ من هنا',desc:'تشكيلة متنوعة من الأزياء النسائية والرجالية والأطفال وفساتين الأعراس والإكسسوارات',shop:'تسوق الآن',products:'تسوق المنتجات',add:'أضف إلى السلة',cart:'سلة المشتريات',empty:'السلة فارغة',none:'لا توجد منتجات مطابقة',total:'الإجمالي',name:'الاسم الكامل',phone:'رقم الهاتف',address:'عنوان التوصيل',checkout:'إعداد الطلب',notice:'هذه نسخة عرض تجريبية. المنتجات والأسعار افتراضية، ولا يتم إرسال الطلبات أو تحصيل أي مبالغ.',foot:'تجربة متجر إلكتروني تجريبية — لا توجد عمليات بيع حقيقية حالياً.',cod:'الدفع عند الاستلام (تجريبي)',sham:'شام كاش — يدوي (غير مفعّل)',sent:'تم تجهيز ملخص الطلب التجريبي. لا يتم إرساله إلى المتجر.',qty:'منتج',cats:['الكل','نسائي','فساتين الأعراس','رجالي','أطفال','أحذية','حقائب','إكسسوارات','تجميل','منزل']},en:{top:'Discover fashion and accessories in one place',search:'Search products...',hero:'Your style starts here',desc:'Discover women’s, men’s and kids’ fashion, bridal gowns and accessories',shop:'Shop now',products:'Shop products',add:'Add to cart',cart:'Shopping cart',empty:'Your cart is empty',none:'No matching products',total:'Total',name:'Full name',phone:'Phone number',address:'Delivery address',checkout:'Prepare order',notice:'Demo only. Products and prices are illustrative. No orders are transmitted and no payments are collected.',foot:'Demo storefront — no real transactions are available yet.',cod:'Cash on delivery (demo)',sham:'Sham Cash — manual (not active)',sent:'Demo order summary prepared. Nothing has been submitted.',qty:'items',cats:['All','Women','Bridal','Men','Kids','Shoes','Bags','Accessories','Beauty','Home']}};
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeImage=value=>{try{const u=new URL(value);return u.protocol==='https:'?escapeHTML(u.href):''}catch{return ''}};

let filter='all',cart={};try{cart=JSON.parse(localStorage.getItem('msb_cart')||'{}')}catch(e){cart={}}
const rates={USD:1,SYP:120,SAR:3.75,AED:3.67}; // Illustrative rates ONLY, not market rates.
let langSetting=localStorage.getItem('msb_lang')||'auto',currency=localStorage.getItem('msb_currency')||'SYP';
function lang(){return langSetting==='auto'?(navigator.language.toLowerCase().startsWith('ar')?'ar':'en'):langSetting}
function t(){return tr[lang()]}function price(usd){return new Intl.NumberFormat(lang()==='ar'?'ar-SY':'en-US',{maximumFractionDigits:currency==='SYP'?0:2}).format(usd*rates[currency])+' '+currency}
function render(){let l=lang(),tx=t();document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('language').value=langSetting;$('currency').value=currency;$('topline').textContent=tx.top;$('search').placeholder=tx.search;$('heroTitle').textContent=tx.hero;$('heroDesc').textContent=tx.desc;$('shopNow').textContent=tx.shop;$('productsTitle').textContent=tx.products;$('noResults').textContent=tx.none;$('cartTitle').textContent=tx.cart;$('checkoutNotice').textContent=tx.notice+' '+(l==='ar'?'أسعار الصرف للعرض فقط وليست أسعاراً حقيقية.':'Exchange rates are placeholders, not live rates.');$('footText').textContent=tx.foot;$('demoNotice').textContent='© 2026 Maison She Bride';$('customerName').placeholder=tx.name;$('customerPhone').placeholder=tx.phone;$('customerAddress').placeholder=tx.address;$('checkoutBtn').textContent=tx.checkout;$('payment').options[0].textContent=tx.cod;$('payment').options[1].textContent=tx.sham;$('categories').innerHTML=categories.map((c,i)=>'<button type="button" data-cat="'+c+'" class="'+(filter===c?'active':'')+'">'+tx.cats[i]+'</button>').join('');let query=$('search').value.trim().toLocaleLowerCase();let filtered=items.filter(p=>(filter==='all'||p.cat===filter)&&(!query||(p.ar+' '+p.en).toLocaleLowerCase().includes(query)));$('results').textContent=filtered.length+' '+tx.qty;$('noResults').classList.toggle('hidden',filtered.length>0);$('products').innerHTML=filtered.map(p=>'<article class="card"><div class="visual" aria-hidden="true">'+(p.image?'<img src="'+safeImage(p.image)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">':escapeHTML(p.icon))+'</div><div class="cardbody"><span class="tag">'+(tx.cats[categories.indexOf(p.cat)]||p.cat)+'</span><h3>'+escapeHTML(p[l])+'</h3><div class="price">'+price(p.usd)+'</div><button type="button" data-add="'+escapeHTML(p.id)+'">'+tx.add+'</button></div></article>').join('');renderCart()}
function renderCart(){let tx=t(),sum=0,count=0;let rows=Object.entries(cart).filter(([id,q])=>items.some(p=>p.id==id)&&Number.isInteger(q)&&q>0).map(([id,q])=>{let p=items.find(p=>p.id==id);sum+=p.usd*q;count+=q;return '<div class="cartitem"><div><b>'+escapeHTML(p[lang()])+'</b><br><small>'+price(p.usd*q)+'</small></div><div><button data-minus="'+id+'">−</button> '+q+' <button data-plus="'+id+'">+</button></div></div>'});$('cartItems').innerHTML=rows.join('')||'<p>'+tx.empty+'</p>';$('cartCount').textContent=count;$('cartTotal').textContent=tx.total+': '+price(sum);$('checkoutForm').classList.add('hidden');localStorage.setItem('msb_cart',JSON.stringify(cart))}
function openCart(show){$('overlay').classList.toggle('show',show);$('drawer').classList.toggle('open',show)}
$('categories').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b){filter=b.dataset.cat;render()}});$('products').addEventListener('click',e=>{let b=e.target.closest('[data-add]');if(b){let id=b.dataset.add;cart[id]=Math.min(99,(cart[id]||0)+1);renderCart();openCart(true)}});$('cartItems').addEventListener('click',e=>{let plus=e.target.closest('[data-plus]'),minus=e.target.closest('[data-minus]');if(plus)cart[plus.dataset.plus]=Math.min(99,(cart[plus.dataset.plus]||0)+1);if(minus){let id=minus.dataset.minus;cart[id]--;if(cart[id]<=0)delete cart[id]}renderCart()});$('cartToggle').onclick=()=>openCart(true);$('closeCart').onclick=()=>openCart(false);$('overlay').onclick=()=>openCart(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')openCart(false)});$('search').addEventListener('input',render);$('shopNow').onclick=()=>$('productsTitle').scrollIntoView({behavior:'smooth'});$('language').onchange=e=>{langSetting=e.target.value;localStorage.setItem('msb_lang',langSetting);render()};$('currency').onchange=e=>{currency=e.target.value;localStorage.setItem('msb_currency',currency);render()};$('checkoutForm').onsubmit=e=>{e.preventDefault();$('checkoutMessage').textContent=t().sent};render();
</script><script>window.MSB_SUPABASE={url:'https://cymwmswpseevemxtugdb.supabase.co',publishableKey:'sb_publishable_OevT9B8LeDvgIzOWtktYTA__LpPRQBE'};</script>
<script src="catalog.js?v=4"></script>
<script>
(async function(){
 const api=window.MSB_CATALOG;if(!api||!api.configured){document.getElementById('results').textContent='تعذر إعداد الاتصال بقاعدة البيانات';return;}
 document.getElementById('results').textContent=lang()==='ar'?'جارٍ تحميل المنتجات الحقيقية...':'Loading live products...';
 const [result,categoryResult]=await Promise.all([api.products(),api.categories()]);
 if(result.error){document.getElementById('results').textContent=lang()==='ar'?'تعذر تحميل المنتجات الحقيقية':'Could not load live products';return;}
 // The demo products are never shown as real stock once a live catalog response succeeds.
 const slugs=new Map((categoryResult.rows||[]).map(c=>[c.id,c.slug]));
 items=result.rows.map(p=>({id:p.id,cat:slugs.get(p.category_id)||'all',ar:p.title_ar,en:p.title_en,usd:Number(p.price_usd),icon:'🛍️',image:(Array.isArray(p.product_images)?p.product_images.slice().sort((a,b)=>a.position-b.position)[0]?.image_url:null)}));
 cart={};localStorage.removeItem('msb_cart');
 render();
 const note=document.getElementById('checkoutNotice');
 note.textContent=lang()==='ar'?'المنتجات من قاعدة البيانات الحقيقية. الطلبات والدفع غير مفعّلين حالياً.':'Products are from the live database. Checkout and payments are not enabled.';
 document.getElementById('checkoutForm').classList.add('hidden');
 
 document.getElementById('demoNotice').textContent=lang()==='ar'?'الكتالوج متصل بقاعدة البيانات؛ الشراء غير مفعّل':'Live catalog connected; purchases disabled';
})();
</script></body></html>
